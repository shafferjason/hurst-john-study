    const half = Math.max(Math.abs(x0 - 960), Math.abs(x1 - 960)) + 70, w = clamp(half * 2, 1220, 1700);   // closer for small drawings, but not so close the words shrink

fitViews();
stations.forEach(st => {

  for (let px = 0; px < 1920; px += 4) for (let py = 0; py < 760; py += 5) if (d[(py * 1920 + px) * 4 + 3] > 150 && d[(py * 1920 + px) * 4] > 90) { x0 = Math.min(x0, px); x1 = Math.max(x1, px); }

// the gold path follows the walker's route on the ground
{

  const curve = new THREE.CatmullRomCurve3(pts), cp = curve.getPoints(pts.length * 40);
  for (const [w, color, op] of [[0.11, 0xf0d4a8, 0.8], [0.9, 0xd4a574, 0.07]]) {

// ground points and gold dust
{

{ let last = -1; stations.forEach((st, i) => { const s = st.s; if (s.kind || s.station === last) return; last = s.station;

// ---------- HUD ----------

function show(t) { renderAt(t); scrub.value = (t / DURATION) * 1000; tt.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(1); }
scrub.oninput = () => { playing = false; show((scrub.value / 1000) * DURATION); };
document.getElementById('play').onclick = () => { playing = !playing; base0 = (scrub.value / 1000) * DURATION; t0 = performance.now(); if (playing) loop(); };
function loop() { if (!playing) return; const t = base0 + (performance.now() - t0) / 1000; if (t >= DURATION) { playing = false; return; } show(t); requestAnimationFrame(loop); }
if (q.has('nobar')) document.getElementById('bar').remove();
show(parseFloat(q.get('t') || '0'));
window.READY = true;
